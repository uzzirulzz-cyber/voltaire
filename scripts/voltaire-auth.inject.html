<style>
/* ── Task 28: federated sign-in (Google · GitHub · Facebook · Phone/SMS) ── */
.volt-divider{display:flex;align-items:center;gap:.75rem;margin:1.25rem 0 .9rem;
  color:var(--bs-secondary-color);font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.volt-divider::before,.volt-divider::after{content:"";flex:1;height:1px;background:var(--bs-border-color)}
.volt-social-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.volt-social-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.62rem .75rem;border-radius:10px;border:1px solid var(--bs-border-color);
  background:var(--bs-card-bg);color:var(--bs-body-color);font-weight:600;font-size:.92rem;
  cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.volt-social-btn:hover{border-color:var(--volt-yellow-deep);transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(10,20,35,.10)}
.volt-social-btn:active{transform:translateY(0)}
.volt-social-btn svg{width:16px;height:16px;flex:none}
.volt-social-btn .volt-spin{width:14px;height:14px;flex:none;border:2px solid var(--bs-border-color);
  border-top-color:var(--volt-yellow-deep);border-radius:50%;animation:volt-rot .7s linear infinite}
@keyframes volt-rot{to{transform:rotate(360deg)}}
#volt-auth-card.busy .btn,#volt-auth-card.busy .volt-social-btn{pointer-events:none;opacity:.6}
.volt-code-input{font-size:1.45rem;letter-spacing:.55em;text-align:center;font-weight:700}
.volt-avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(155deg,var(--volt-navy-mid),var(--volt-navy-deep));color:var(--volt-yellow);
  font-family:Orbitron,Inter,sans-serif;font-size:1.5rem;font-weight:700;overflow:hidden}
#volt-signedin .btn-link{text-decoration:none;color:var(--bs-secondary-color)}
#volt-signedin .btn-link:hover{color:var(--volt-yellow-deep)}
.volt-provider-badge{display:inline-block;padding:.18rem .6rem;border-radius:999px;
  border:1px solid var(--volt-yellow-deep);color:var(--volt-yellow-ink);
  background:color-mix(in srgb,var(--volt-yellow) 18%,transparent);font-size:.72rem;font-weight:700}
[data-bs-theme="dark"] .volt-provider-badge{color:var(--volt-yellow)}
#volt-recaptcha{min-height:0}
</style>

<div id="volt-social-wrap">
  <div class="volt-divider" aria-hidden="true">or continue with</div>
  <div class="volt-social-grid">
    <button type="button" class="volt-social-btn" data-social="google" aria-label="Continue with Google">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
      Google
    </button>
    <button type="button" class="volt-social-btn" data-social="github" aria-label="Continue with GitHub">
      <svg viewBox="0 0 24 24" class="fill-current" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
      GitHub
    </button>
    <button type="button" class="volt-social-btn" data-social="facebook" aria-label="Continue with Facebook">
      <svg viewBox="0 0 24 24" class="fill-current" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      Facebook
    </button>
    <button type="button" class="volt-social-btn" id="volt-phone-btn" aria-label="Continue with phone SMS">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Phone / SMS
    </button>
  </div>
</div>

<div id="volt-phone" hidden>
  <button type="button" class="btn btn-link p-0 mb-2" id="volt-phone-back">← Back to email</button>
  <div id="volt-phone-step1">
    <h2 class="h5 fw-bold mb-1">Sign in with your phone</h2>
    <p class="small">We’ll text you a 6-digit code. Include the country code — e.g. <strong>+1 555 123 4567</strong>.</p>
    <input class="form-control form-control-lg mb-3" id="volt-phone-input" type="tel" inputmode="tel"
      autocomplete="tel" placeholder="+1 555 123 4567" aria-label="Phone number">
    <button type="button" class="btn btn-primary w-100" id="volt-phone-send">Send code</button>
  </div>
  <div id="volt-phone-step2" hidden>
    <h2 class="h5 fw-bold mb-1">Enter the code</h2>
    <p class="small">Sent to <strong id="volt-phone-sent-to"></strong>.</p>
    <input class="form-control form-control-lg volt-code-input mb-3" id="volt-phone-code" type="text"
      inputmode="numeric" maxlength="6" placeholder="000000" aria-label="6 digit SMS code" autocomplete="one-time-code">
    <button type="button" class="btn btn-primary w-100" id="volt-phone-verify">Verify &amp; sign in</button>
    <button type="button" class="btn btn-link w-100 mt-2" id="volt-phone-resend">Didn’t get it? Resend</button>
  </div>
</div>

<div id="volt-signedin" class="text-center" hidden>
  <div id="volt-user-avatar" class="volt-avatar mx-auto" aria-hidden="true">♪</div>
  <h2 class="h4 fw-bold mt-3 mb-1">You’re in the world.</h2>
  <p class="mb-1"><strong id="volt-user-name"></strong>&nbsp; <span class="volt-provider-badge" id="volt-user-provider"></span></p>
  <p class="text-body-secondary small mb-4" id="volt-user-email"></p>
  <div class="d-grid gap-2">
    <a class="btn btn-primary" href="/">← Back to the world</a>
    <a class="btn btn-outline-primary" href="https://playbeatdigital.world#studio">Open the studio ↗</a>
    <button type="button" class="btn btn-link" id="volt-user-signout">Sign out</button>
  </div>
</div>

<div id="volt-recaptcha" aria-hidden="true"></div>

<script type="module">
/* PlayBeat VOLTAIRE — real sign-in (Task 28).
   Firebase Auth (project gen-lang-client-0800809003) mints an ID token
   client-side; the voltaire-world Worker verifies it and sets the signed
   pb_world_session cookie. All five ways: email+password, Google, GitHub,
   Facebook, Phone/SMS. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
  getAuth, signInWithPopup, GoogleAuthProvider, GithubAuthProvider, FacebookAuthProvider,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile,
  sendPasswordResetEmail, RecaptchaVerifier, signInWithPhoneNumber,
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const CFG = {
  apiKey: "AIzaSyCsODAXMFfkqz779F6GEqZR7BPmCfMPiTk",
  authDomain: "gen-lang-client-0800809003.firebaseapp.com",
  projectId: "gen-lang-client-0800809003",
  storageBucket: "gen-lang-client-0800809003.firebasestorage.app",
  messagingSenderId: "1093973326302",
  appId: "1:1093973326302:web:daebb8ba222ce7bebd454f",
};
const app = initializeApp(CFG);
const auth = getAuth(app);

const $ = (id) => document.getElementById(id);
const feedback = $("feedback");
const card = document.querySelector(".volt-auth-card");
const switcher = document.querySelector(".volt-auth-switch");
const socialWrap = $("volt-social-wrap");
const phonePanel = $("volt-phone");
const signedIn = $("volt-signedin");
const recaptchaBox = $("volt-recaptcha");

const showMessage = (msg, type = "warning") => {
  feedback.textContent = msg;
  feedback.className = "alert alert-" + type;
};
const hideMessage = () => { feedback.className = "alert d-none"; };

/* ── neutralize the design mock handlers by cloning the forms ────────── */
for (const id of ["signin-form", "signup-form"]) {
  const form = $(id);
  const clone = form.cloneNode(true);
  form.replaceWith(clone);
}
/* password visibility toggles inside the clones */
document.querySelectorAll("[data-toggle-password]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const el = $(btn.dataset.togglePassword);
    const hidden = el.type === "password";
    el.type = hidden ? "text" : "password";
    btn.textContent = hidden ? "Hide" : "Show";
    btn.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
  });
});

/* ── busy guard + friendly Firebase error messages ───────────────────── */
let busy = false;
async function guard(fn) {
  if (busy) return;
  busy = true;
  card.classList.add("busy");
  hideMessage();
  try { await fn(); }
  catch (err) {
    /* Firebase errors → friendly map; other errors (our API) keep their text */
    const isFirebase = err && typeof err.code === "string" && err.code.startsWith("auth/");
    showMessage(
      isFirebase ? friendly(err) : (err && err.message) || "Sign-in failed — please try again.",
      "danger"
    );
  }
  finally {
    busy = false;
    card.classList.remove("busy");
  }
}
function friendly(err) {
  const code = err && err.code ? String(err.code) : "";
  const map = {
    "auth/unauthorized-domain": "This domain isn’t in your Firebase project’s Authorized domains yet — add it in Firebase Console → Authentication → Settings.",
    "auth/operation-not-allowed": "This sign-in method isn’t enabled yet — turn it on in Firebase Console → Authentication → Sign-in method.",
    "auth/popup-blocked": "The sign-in popup was blocked — allow popups for this site and try again.",
    "auth/popup-closed-by-user": "Sign-in was cancelled — try again whenever you’re ready.",
    "auth/cancelled-popup-request": "Sign-in was cancelled — try again whenever you’re ready.",
    "auth/account-exists-with-different-credential": "That email is already registered with a different sign-in method — use the one you signed up with.",
    "auth/email-already-in-use": "That email already has an account — switch to Sign in.",
    "auth/invalid-credential": "Wrong email or password.",
    "auth/wrong-password": "Wrong email or password.",
    "auth/user-not-found": "No account with that email — create one on the Sign up tab.",
    "auth/weak-password": "Use a stronger password (12+ characters).",
    "auth/invalid-phone-number": "That phone number doesn’t look right — include the country code, e.g. +1 555 123 4567.",
    "auth/invalid-verification-code": "That code isn’t valid — check the 6-digit SMS code and try again.",
    "auth/code-expired": "That code expired — request a fresh one.",
    "auth/too-many-requests": "Too many attempts — wait a moment and try again.",
    "auth/network-request-failed": "Network hiccup talking to Firebase — check your connection and retry.",
  };
  return map[code] || "Sign-in failed — please try again.";
}

/* ── ID token → Worker session cookie ────────────────────────────────── */
async function exchange(firebaseUser) {
  const idToken = await firebaseUser.getIdToken(true);
  const res = await fetch("/api/auth/firebase", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ idToken }),
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.error) || "Could not finish sign-in.");
  showSignedIn(data.user);
}

/* ── email + password (Firebase) ─────────────────────────────────────── */
$("signin-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const form = e.currentTarget;
  if (!form.checkValidity()) { form.reportValidity(); return; }
  const email = $("login-email").value.trim();
  const password = $("login-password").value;
  guard(async () => {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    await exchange(cred.user);
  });
});
$("signup-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const form = e.currentTarget;
  if (!form.checkValidity()) { form.reportValidity(); return; }
  const password = $("register-password").value;
  if (password !== $("register-confirm").value) {
    showMessage("Passwords do not match.");
    return;
  }
  const name = $("register-name").value.trim();
  const email = $("register-email").value.trim();
  guard(async () => {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    if (name) await updateProfile(cred.user, { displayName: name });
    await exchange(auth.currentUser);
  });
});
$("forgot-link").addEventListener("click", (e) => {
  e.preventDefault();
  const email = $("login-email").value.trim();
  if (!email) { showMessage("Enter your email above first, then tap Forgot password."); return; }
  guard(async () => {
    await sendPasswordResetEmail(auth, email);
    showMessage("Password reset email sent to " + email + " — check your inbox.", "success");
  });
});

/* ── Google · GitHub · Facebook popups ───────────────────────────────── */
const PROVIDERS = {
  google: () => new GoogleAuthProvider(),
  github: () => new GithubAuthProvider(),
  facebook: () => new FacebookAuthProvider(),
};
document.querySelectorAll("[data-social]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const label = btn.innerHTML;
    btn.innerHTML = '<span class="volt-spin" aria-hidden="true"></span>';
    guard(async () => {
      const cred = await signInWithPopup(auth, PROVIDERS[btn.dataset.social]());
      await exchange(cred.user);
    }).finally(() => { btn.innerHTML = label; });
  });
});

/* ── phone / SMS ─────────────────────────────────────────────────────── */
let confirmation = null;
function freshRecaptcha() {
  const fresh = recaptchaBox.cloneNode(false);
  recaptchaBox.replaceWith(fresh);
  return fresh;
}
function resetPhone(keepNumber) {
  confirmation = null;
  $("volt-phone-step1").hidden = false;
  $("volt-phone-step2").hidden = true;
  $("volt-phone-code").value = "";
  if (!keepNumber) $("volt-phone-input").value = "";
  freshRecaptcha();
}
function showPhoneStep() {
  hideMessage();
  switcher.hidden = true;
  $("signin").hidden = true;
  $("signup").hidden = true;
  socialWrap.hidden = true;
  phonePanel.hidden = false;
}
function showEmailStep() {
  hideMessage();
  const signingIn = $("signin-tab").getAttribute("aria-selected") === "true";
  switcher.hidden = false;
  $("signin").hidden = !signingIn;
  $("signup").hidden = signingIn;
  socialWrap.hidden = false;
  phonePanel.hidden = true;
  resetPhone(true);
}
$("volt-phone-btn").addEventListener("click", showPhoneStep);
$("volt-phone-back").addEventListener("click", showEmailStep);
$("volt-phone-send").addEventListener("click", () => {
  const raw = $("volt-phone-input").value;
  const cleaned = raw.replace(/[\s\-().]/g, "");
  const normalized = /^\+[1-9]\d{7,14}$/.test(cleaned)
    ? cleaned
    : /^\d{10}$/.test(cleaned) ? "+1" + cleaned : null;
  if (!normalized) {
    showMessage("Enter a valid phone number with country code, e.g. +1 555 123 4567.");
    return;
  }
  guard(async () => {
    const verifier = new RecaptchaVerifier(auth, "volt-recaptcha", { size: "invisible" });
    try {
      confirmation = await signInWithPhoneNumber(auth, normalized, verifier);
      $("volt-phone-step1").hidden = true;
      $("volt-phone-step2").hidden = false;
      $("volt-phone-sent-to").textContent = normalized;
      $("volt-phone-code").value = "";
      $("volt-phone-code").focus();
    } catch (err) {
      try { verifier.clear(); } catch {}
      throw err;
    }
  });
});
$("volt-phone-verify").addEventListener("click", () => {
  if (!confirmation) return;
  const code = $("volt-phone-code").value.replace(/\D/g, "");
  if (code.length !== 6) { showMessage("Enter the 6-digit code from the SMS."); return; }
  guard(async () => {
    const cred = await confirmation.confirm(code);
    await exchange(cred.user);
  });
});
$("volt-phone-resend").addEventListener("click", () => {
  hideMessage();
  resetPhone(true);
});

/* ── signed-in state ─────────────────────────────────────────────────── */
const PROVIDER_LABELS = {
  google: "Google", github: "GitHub", facebook: "Facebook",
  phone: "Phone · SMS", password: "Email",
};
function showSignedIn(user) {
  hideMessage();
  $("volt-user-name").textContent = user.name || "PlayBeat rider";
  $("volt-user-email").textContent = user.email || "";
  $("volt-user-provider").textContent = PROVIDER_LABELS[user.provider] || user.provider;
  const avatar = $("volt-user-avatar");
  if (user.photoUrl) {
    avatar.textContent = "";
    const img = new Image();
    img.src = user.photoUrl;
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    img.style.cssText = "width:100%;height:100%;object-fit:cover";
    avatar.appendChild(img);
  } else {
    const first = (user.name || "P").trim().charAt(0).toUpperCase();
    avatar.textContent = first === "+" ? "♪" : first;
  }
  switcher.hidden = true;
  $("signin").hidden = true;
  $("signup").hidden = true;
  socialWrap.hidden = true;
  phonePanel.hidden = true;
  signedIn.hidden = false;
}
$("volt-user-signout").addEventListener("click", async () => {
  await fetch("/api/auth/logout", { method: "POST" }).catch(() => {});
  try { await auth.signOut(); } catch {}
  hideMessage();
  signedIn.hidden = true;
  const signingIn = true;
  switcher.hidden = false;
  $("signin").hidden = !signingIn;
  $("signup").hidden = signingIn;
  socialWrap.hidden = false;
  resetPhone(false);
});

/* ── restore an existing session on load ─────────────────────────────── */
(async () => {
  try {
    const res = await fetch("/api/auth/me");
    if (res.ok) {
      const data = await res.json();
      if (data && data.user) showSignedIn(data.user);
    }
  } catch {}
})();
</script>
