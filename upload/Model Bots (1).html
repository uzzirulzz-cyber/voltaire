<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Model Bots</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D14; --panel:#131826; --panel-2:#171D2E; --border:#242B3D;
    --text:#ECEFF6; --muted:#8991A8;
    --violet:#7C6CF0; --coral:#FF7A59; --mint:#4FD6B5; --gold:#F0B94F;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F4F5F8; --panel:#FFFFFF; --panel-2:#F8F9FC; --border:#E4E6ED;
      --text:#15182A; --muted:#6B7280;
    }
  }
  :root[data-theme="light"]{
    --bg:#F4F5F8; --panel:#FFFFFF; --panel-2:#F8F9FC; --border:#E4E6ED;
    --text:#15182A; --muted:#6B7280;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Inter",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:48px 0 48px;
    padding-top:calc(48px + env(safe-area-inset-top,0px));
    padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));
  }
  .wrap{ width:100%; max-width:980px; padding:0 28px; }
  .eyebrow{ font-size:13px; color:var(--muted); margin:0 0 6px; }
  h1{ font-size:26px; font-weight:800; letter-spacing:-0.01em; margin:0 0 28px; }

  .rail{
    position:relative; overflow:hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .track{
    display:flex; gap:22px; width:max-content;
    animation: scroll-rtl 34s linear infinite;
  }
  .rail:hover .track{ animation-play-state:paused; }
  @keyframes scroll-rtl{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce){
    .track{ animation:none; }
  }

  .card{
    flex:0 0 auto; width:116px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    text-align:center;
  }
  @property --angle{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
  .icon{
    position:relative;
    width:76px; height:76px; border-radius:22px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none;
    transition: transform .25s ease;
  }
  .icon::before{
    content:""; position:absolute; inset:0; border-radius:inherit; padding:2px;
    background:conic-gradient(from var(--angle,0deg), #0A2A6B, #2E8CF0, #7FD4FF, #2E8CF0, #0A2A6B);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    animation: spin-flame 2.6s linear infinite;
  }
  .icon::after{
    content:""; position:absolute; inset:-6px; border-radius:inherit;
    background:radial-gradient(circle, rgba(46,140,240,.55), rgba(46,140,240,0) 70%);
    filter:blur(7px); z-index:-1;
    animation: flame-pulse 1.8s ease-in-out infinite;
  }
  @keyframes spin-flame{ to{ --angle:360deg; } }
  @keyframes flame-pulse{ 0%,100%{ opacity:.55; transform:scale(.92); } 50%{ opacity:1; transform:scale(1.12); } }
  .card:hover .icon{ transform: translateY(-4px); }
  .icon svg{ width:36px; height:36px; display:block; }
  .name{ font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; }
  .tag{ font-size:11px; color:var(--muted); margin-top:-6px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Choose a bot</p>
  <h1>Official bots</h1>

  <div class="rail">
    <div class="track" id="track"></div>
  </div>
</div>

<script>
const bots = [
  { name:"Assistant", tag:"General", accent:"#7C6CF0", bg:"#7C6CF0",
    svg:`<circle cx="18" cy="18" r="13" fill="white" opacity=".95"/><circle cx="14" cy="17" r="2.3" fill="#7C6CF0"/><circle cx="22" cy="17" r="2.3" fill="#7C6CF0"/><path d="M12 23c2 2.2 10 2.2 12 0" stroke="#7C6CF0" stroke-width="2.4" stroke-linecap="round" fill="none"/>` },
  { name:"Astra", tag:"Reasoning", accent:"#1C1F26", bg:"#1C1F26",
    svg:`<g fill="white"><circle cx="18" cy="18" r="3"/><circle cx="18" cy="7" r="1.6"/><circle cx="18" cy="29" r="1.6"/><circle cx="7" cy="18" r="1.6"/><circle cx="29" cy="18" r="1.6"/><circle cx="10.5" cy="10.5" r="1.4"/><circle cx="25.5" cy="10.5" r="1.4"/><circle cx="10.5" cy="25.5" r="1.4"/><circle cx="25.5" cy="25.5" r="1.4"/></g>` },
  { name:"Opus", tag:"Flagship", accent:"#C97A58", bg:"#1C1611",
    svg:`<g fill="#E3A07E"><path d="M18 5 L20 16 L31 18 L20 20 L18 31 L16 20 L5 18 L16 16 Z"/></g>` },
  { name:"Fable", tag:"Creative", accent:"#D9CFC2", bg:"#EFEBE3",
    svg:`<g fill="#B89B7A"><path d="M18 6 L20.5 15.5 L30 18 L20.5 20.5 L18 30 L15.5 20.5 L6 18 L15.5 15.5 Z"/></g>` },
  { name:"Argon", tag:"Multimodal", accent:"#5AC8FA", bg:"#FFFFFF",
    svg:`<path d="M18 6 C19 14 22 17 30 18 C22 19 19 22 18 30 C17 22 14 19 6 18 C14 17 17 14 18 6 Z" fill="url(#g1)"/><defs><linearGradient id="g1" x1="6" y1="6" x2="30" y2="30"><stop offset="0" stop-color="#5AC8FA"/><stop offset=".5" stop-color="#8E7CF0"/><stop offset="1" stop-color="#F0B94F"/></linearGradient></defs>` },
  { name:"Grok", tag:"Realtime", accent:"#2A2A2A", bg:"#141414",
    svg:`<circle cx="18" cy="18" r="12" fill="none" stroke="white" stroke-width="2.6"/><line x1="10" y1="26" x2="26" y2="10" stroke="white" stroke-width="2.6" stroke-linecap="round"/>` },
  { name:"K3", tag:"Agentic", accent:"#2B2B2B", bg:"#161616",
    svg:`<g fill="white"><rect x="6" y="9" width="2.6" height="18" rx="1.3"/><rect x="11.2" y="6" width="2.6" height="24" rx="1.3"/><rect x="16.4" y="11" width="2.6" height="14" rx="1.3"/><rect x="21.6" y="7" width="2.6" height="22" rx="1.3"/><rect x="26.8" y="13" width="2.6" height="10" rx="1.3"/></g>` },
  { name:"Large-4", tag:"Open", accent:"#F0501E", bg:"#241712",
    svg:`<g fill="none" stroke-linecap="round" stroke-width="2.6"><path d="M11 24 L18 8 L25 24" stroke="#FFB94F"/><path d="M14 19 L22 19" stroke="#FF5B2E"/></g>` },
  { name:"Nova", tag:"Vision", accent:"#49C5A0", bg:"#0F2420",
    svg:`<circle cx="18" cy="18" r="10" fill="none" stroke="#49C5A0" stroke-width="2.4"/><circle cx="18" cy="18" r="3.4" fill="#49C5A0"/>` },
  { name:"Solace", tag:"Writing", accent:"#E86FA6", bg:"#241620",
    svg:`<path d="M9 26 C9 14 27 14 27 26 C20 22 14 22 9 26 Z" fill="#E86FA6"/>` }
];

function iconMarkup(b){
  return `<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">${b.svg}</svg>`;
}
function cardMarkup(b){
  return `<div class="card">
    <div class="icon">${iconMarkup(b)}</div>
    <div class="name">${b.name}</div>
    <div class="tag">${b.tag}</div>
  </div>`;
}

const track = document.getElementById('track');
const doubled = bots.concat(bots);
track.innerHTML = doubled.map(cardMarkup).join('');
</script>
</body>
</html>
